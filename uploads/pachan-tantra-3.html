<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पाचन तंत्र की यात्रा</title>
<style>
:root{--bg:#0e2a3a;--ink:#10303f;--coral:#ff6b5e;--lime:#b5e048;--amber:#ffc247;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:"Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif;line-height:1.6}
header{padding:14px 16px 8px;max-width:1000px;margin:auto}
h1{margin:0;font-size:clamp(20px,4.5vw,28px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sc{background:var(--amber);color:var(--ink);font-weight:800;border-radius:999px;padding:3px 14px}
.dots{display:flex;gap:6px;margin-top:8px}.dots i{flex:1;height:7px;border-radius:9px;background:#ffffff30}
.dots i.done{background:var(--lime)}.dots i.now{background:var(--amber)}
main{max-width:1000px;margin:auto;padding:8px 16px 28px;display:grid;gap:16px;grid-template-columns:minmax(0,340px) 1fr;align-items:start}
.fig{background:#dff1f5;border-radius:22px;padding:6px}
svg{width:100%;height:auto;display:block}
.panel{background:var(--card);color:var(--ink);border-radius:22px;padding:18px 18px 20px;min-height:300px}
.panel h2{margin:0 0 4px;font-size:22px}.panel p{margin:6px 0 12px}
.b{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 18px;min-height:46px;background:var(--coral);color:#fff;cursor:pointer;margin:2px 0}
.b:disabled{opacity:.45;cursor:default}.b.alt{background:var(--ink)}
.b:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ex{background:#eaf7e0;border-left:6px solid var(--lime);border-radius:12px;padding:10px 14px;margin:12px 0}
.q{margin-top:10px}.q b{display:block;margin-bottom:6px}
.o{display:block;width:100%;text-align:left;font:inherit;background:#eef3f6;border:2px solid #cfdde4;border-radius:12px;padding:10px 12px;margin:6px 0;min-height:44px;cursor:pointer;color:var(--ink)}
.o.ok{background:#d6f5a8;border-color:#7cb518}.o.no{background:#ffd9d4;border-color:var(--coral);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.organ{transition:filter .3s}.on{filter:drop-shadow(0 0 7px #fff59a)}
#food{transition:r .5s,fill .5s}
text{font:10px "Noto Sans Devanagari","Nirmala UI",Mangal,sans-serif;fill:#10303f}
@media(max-width:760px){main{grid-template-columns:1fr}.fig{max-width:340px;margin:auto}}
body{background:radial-gradient(circle at 15% 0,#1c5a73 0,transparent 45%),radial-gradient(circle at 90% 100%,#2b3f7a 0,transparent 40%),#0b2433;background-attachment:fixed}
h1{background:linear-gradient(90deg,#fff,#ffe9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{font:inherit;font-weight:700;border:2px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:999px;padding:5px 14px;min-height:40px;cursor:pointer}.lang:hover{background:#ffffff30}.lang:focus-visible{outline:3px solid var(--amber)}
.fig{position:sticky;top:8px;box-shadow:0 10px 30px #0006;background:linear-gradient(#e6f6f9,#cfeaf0)}
.panel{box-shadow:0 10px 30px #0005;border-top:6px solid var(--amber)}
.bd{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-size:13px;font-weight:700;margin-bottom:6px}
.b{box-shadow:0 4px 0 #0003;transition:transform .15s}.b:not(:disabled):hover{transform:translateY(-2px)}.b:not(:disabled):active{transform:translateY(2px)}
.o{transition:transform .15s,background .2s}.o:not(:disabled):hover{transform:translateX(4px);background:#e2f1f7}
.o.ok{animation:pop .4s}@keyframes pop{50%{transform:scale(1.04)}}
#food{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{stroke-width:4}}
.q{scroll-margin-top:calc(38vh + 16px)}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:760px){main{display:block}.panel{margin-top:12px}.fig{top:0;z-index:5;max-width:none;margin:0 -16px;border-radius:0 0 22px 22px;padding:4px}.fig svg{width:auto;max-width:100%;max-height:36vh;margin:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

if(ph=='end'){const m=score>=60?u('m1'):score>=40?u('m2'):u('m3');P.innerHTML=`<h2>${u('eh')}</h2><p>${u('sr')}: <b>${score}/70</b> — ${m}</p><p>${u('ep')}</p><button class="b" data-a="again">${u('ag')}</button>`;return}
const s=D(cur);let h=`<div class="bd">${cur+1}/7</div><h2>${s.n}</h2><p>${s.i}</p><button class="b" data-a="ac" ${arrived&&!acted&&!busy?'':'disabled'}>${s.a}</button>`;
if(acted){h+=`<div class="ex">${s.x}</div><div class="q" id="qz"><b>❓ ${s.q[0]}</b>`+ord.map(i=>`<button class="o${done&&i==0?' ok':wr.includes(i)?' no':''}" data-a="o" data-i="${i}" ${done||wr.includes(i)?'disabled':''}>${s.q[i+1]}</button>`).join('')+'</div>';if(done)h+=`<button class="b alt" data-a="nx">${cur<6?u('nx'):u('rs')}</button>`}
P.innerHTML=h}
function reset(){cur=0;score=0;ph='intro';acted=done=arrived=busy=false;$('sc').textContent=0;food.setAttribute('cx',150);food.setAttribute('cy',8);food.setAttribute('r',11);food.setAttribute('fill','#e8b15f');food.style.opacity=1;render()}
function stage(k){cur=k;first=true;acted=done=arrived=busy=false;wr=[];render();const go=()=>{arrived=true;render();const a=P.querySelector('[data-a=ac]');a&&a.focus()};S[k].r?mv(S[k].r,go):go()}
function act(){const s=S[cur];busy=true;render();food.setAttribute('r',s.f[0]);food.setAttribute('fill',s.f[1]);fx(s.pc,s.sp?10:7,s.sp);const fin=()=>{busy=false;acted=true;ord=[0,1,2].sort(()=>Math.random()-.5);render();const q=$('qz');q&&q.scrollIntoView({behavior:'smooth',block:'start'})};if(cur==6)mv('M150 440L150 480L150 530',()=>{food.style.opacity=0});s.ar?mv(s.ar,fin):fin()}
function confetti(){for(let k=0;k<36;k++){const c=document.createElement('span');c.className='cf';c.textContent=['🎉','⭐','✨','🎊'][k%4];c.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*1.2}s;font-size:${16+Math.random()*16}px`;document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
P.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.a;
if(a=='go'){ph='stage';stage(0)}else if(a=='ac')act();
else if(a=='o'){const i=+b.dataset.i;if(i==0){done=true;score+=first?10:5;$('sc').textContent=score;render();const n=P.querySelector('[data-a=nx]');n&&n.focus()}else{first=false;wr.push(i);render()}}
else if(a=='nx'){if(cur<6)stage(cur+1);else{ph='end';cur=7;render();confetti()}}
else if(a=='again')reset()};
$('lg').onclick=()=>{L=L=='hi'?'en':'hi';render()};
reset();
</script></body></html>
